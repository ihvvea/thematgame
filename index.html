.brandbar .logo-mark{height:17px;color:#2B2B2D}
.brandbar .ib{position:absolute;top:5px}
.brandbar .l{left:8px}.brandbar .r{right:8px}
.ib{background:none;border:0;width:38px;height:38px;border-radius:12px;cursor:pointer;display:grid;place-items:center;color:var(--sub)}
.ib:active{background:var(--line2)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib.hide{visibility:hidden}

/* HUD */
.hud{height:58px;display:none;align-items:center;gap:12px;padding:0 20px;background:var(--sf);border-top:1px solid var(--line2);border-bottom:1px solid var(--line);flex:none}
.hud.show{display:flex}
.hud .lab{flex:1;min-width:0;line-height:1.3}
.hud .lab .s{font-weight:600;font-size:12px;color:var(--mute)}
.hud .lab .n{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .tmw{text-align:right;line-height:1.25}
.hud .tm{font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.hud .tm.pen{color:var(--bad);animation:shake .3s}
.hud .goal{font-size:12px;color:var(--mute)}

/* buttons */
.btn{font-family:inherit;font-weight:600;font-size:16px;letter-spacing:-.01em;border:0;border-radius:16px;height:56px;padding:0 24px;background:var(--navy);color:#fff;cursor:pointer;width:100%;max-width:360px;transition:transform .12s cubic-bezier(.3,1.6,.5,1),background .15s;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:scale(.97);background:var(--navy2)}
.btn.sub{background:var(--sf);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sub:active{background:var(--line2)}
.btn.ghost{background:transparent;color:var(--sub);height:44px;font-weight:500;font-size:15px}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btns{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center}

/* title */
.title-scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 28px 32px;text-align:center;background:radial-gradient(120% 70% at 50% 30%,#FFFFFF 0%,#F5F6F8 60%)}
.eyebrow{font-weight:600;font-size:13px;color:var(--sub);letter-spacing:.02em}
.logo{font-weight:800;line-height:1.28;letter-spacing:-.045em;margin-top:10px}
.logo .b{margin-top:4px}
.logo .a{display:block;font-size:24px;color:var(--sub);font-weight:700;letter-spacing:-.03em}
.logo .b{display:block;font-size:48px;color:var(--ink)}
.hero{position:relative;width:260px;height:168px;margin:32px 0 28px}
.hero .w{position:absolute;top:0;width:12px;height:28px;border-left:2.5px solid rgba(30,42,71,.28);border-radius:50%;animation:wave 2.2s ease-in-out infinite}
.hero .w:nth-of-type(1){left:44px}.hero .w:nth-of-type(2){left:86px;animation-delay:.35s}.hero .w:nth-of-type(3){left:128px;animation-delay:.7s}
@keyframes wave{0%,100%{transform:translateY(4px);opacity:.15}50%{transform:translateY(-6px);opacity:1}}
.hero .zz{position:absolute;right:-6px;top:-6px;font-weight:800;color:var(--sil);font-size:15px;animation:zz 2.6s ease-in-out infinite}
@keyframes zz{0%,100%{transform:translateY(2px);opacity:.3}50%{transform:translateY(-6px);opacity:1}}
.hero .float{animation:flt 3.2s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-5px)}}
.title-scr .sub{font-size:15px;color:var(--sub);line-height:1.65}
.title-scr .sub b{color:var(--ink);font-weight:700}
.title-scr .btns{margin-top:28px}
.fine{font-size:12px;color:var(--mute);line-height:1.5;margin-top:18px}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.title-scr>*:not(.snow){position:relative;z-index:1}
.snow i{position:absolute;top:-24px;display:block;animation:fall linear infinite}
.snow i svg{display:block;width:100%;height:100%;fill:none;stroke:#C9CFD9;stroke-width:1.6;stroke-linecap:round;animation:sway 3.6s ease-in-out infinite alternate}
@keyframes fall{to{transform:translateY(110vh) rotate(200deg)}}
@keyframes sway{from{translate:-8px 0}to{translate:8px 0}}

/* map */
.page{position:absolute;inset:0;overflow:auto;padding:32px 20px 40px;display:flex;flex-direction:column;gap:12px}
.page>*{flex-shrink:0}
.h1{font-size:28px;font-weight:800;letter-spacing:-.035em;line-height:1.25}
.lead{font-size:15px;color:var(--sub);line-height:1.55;margin:2px 0 14px}
.card{width:100%;display:flex;align-items:center;gap:16px;background:var(--sf);border-radius:var(--r);padding:16px 18px;border:0;box-shadow:0 1px 2px rgba(17,19,24,.04);cursor:pointer;text-align:left;font-family:inherit;color:inherit;transition:transform .12s}
.card:active{transform:scale(.985)}
.card .no{flex:none;width:44px;height:44px;border-radius:14px;background:var(--tint);color:var(--navy);font-weight:800;font-size:16px;display:grid;place-items:center}
.card.done .no{background:var(--navy);color:#fff}
.card .t{flex:1;min-width:0}
.card .t .nm{font-weight:700;font-size:16px;line-height:1.35}
.card .t .ds{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.45}
.card .rec{text-align:right;font-size:13px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.4}
.card .rec .st{color:var(--navy);font-size:12px;letter-spacing:1px}
.card .rec .go{color:var(--navy);font-weight:600}
.card.lock{opacity:.45;cursor:default}
.sec{width:100%;margin-top:28px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline}
.sec .a{font-size:18px;font-weight:700;letter-spacing:-.025em}
.sec .b{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.sec-lead{font-size:14px;color:var(--sub);line-height:1.55;margin-bottom:6px;text-align:left;width:100%}

/* tier ladder */
.ladder{width:100%;background:var(--sf);border-radius:var(--r);overflow:hidden}
.tier{display:flex;align-items:center;gap:14px;padding:14px 18px;position:relative;text-align:left}
.tier+.tier{border-top:1px solid var(--line2)}
.tier .chip{flex:none;width:84px;height:30px;border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:10.5px;letter-spacing:.05em;padding-left:.05em}
.tier .tx{flex:1;min-width:0}
.tier .tx .a{font-weight:700;font-size:15px;line-height:1.35}
.tier .tx .b{font-size:12.5px;color:var(--sub);line-height:1.45}
.tier .rg{font-size:13px;font-weight:600;color:var(--ch);font-variant-numeric:tabular-nums;white-space:nowrap}
.tier .me{position:absolute;left:6px;top:50%;width:4px;height:28px;margin-top:-14px;border-radius:4px;background:var(--navy)}
.tier.cur{background:var(--tint)}
.t-WHITE .chip{background:#fff;color:#5A5E66;box-shadow:inset 0 0 0 1.5px var(--sil)}
.t-SILVER .chip{background:linear-gradient(135deg,#F1F2F4,#AEB3BB);color:#24272D}
.t-CHARCOAL .chip{background:#3A3B43;color:#E9EAED}
.t-NAVY .chip{background:linear-gradient(135deg,#34477A,#16203A);color:#E2E8F6}
.t-BLACK .chip{background:linear-gradient(135deg,#34353B,#000);color:#fff}

/* intro / result */
.intro,.result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:36px 20px 36px;text-align:center;overflow:auto}
.intro>*,.result>*{flex-shrink:0}
.intro{justify-content:center}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:var(--tint);color:var(--navy);font-weight:700;font-size:12.5px;letter-spacing:.01em}
.intro h2{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.25;margin-top:14px}
.intro .ds{font-size:15px;color:var(--sub);margin-top:6px;line-height:1.5}
.howto{background:var(--sf);border-radius:var(--r);padding:8px 20px;text-align:left;width:100%;max-width:380px;list-style:none;margin-top:28px;counter-reset:h}
.howto li{display:flex;gap:14px;counter-increment:h;padding:13px 0;font-size:15px;line-height:1.55}
.howto li+li{border-top:1px solid var(--line2)}
.howto li::before{content:counter(h,decimal-leading-zero);flex:none;font-weight:800;font-size:13px;color:var(--navy);margin-top:2px;width:20px}
.howto b{color:var(--navy)}
.goalbox{display:flex;gap:8px;margin-top:16px}
.goalbox span{background:var(--sf);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--sub)}
.goalbox b{color:var(--ink);font-variant-numeric:tabular-nums}
.intro .btns{margin-top:32px}
.res-head{width:100%;max-width:380px;background:var(--sf);border-radius:24px;padding:28px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;overflow:hidden}
.res-head .big1{font-weight:800;font-size:15px;letter-spacing:.24em;color:var(--navy);padding-left:.24em}
.res-head .big1.fail{color:var(--bad)}
.res-head .tm{font-weight:800;font-size:52px;font-variant-numeric:tabular-nums;letter-spacing:-.045em;line-height:1}
.res-head .tm small{font-size:20px;color:var(--sub);margin-left:3px;font-weight:600;letter-spacing:0}
.res-head .stg{font-size:13px;color:var(--sub)}
.stars{display:flex;gap:8px}
.stars i{width:28px;height:28px;display:block}
.stars i svg{width:100%;height:100%;fill:#E1E4E9}
.stars i.on svg{fill:var(--navy);animation:pop .4s cubic-bezier(.3,1.7,.5,1) backwards}
.stars i.on:nth-child(2) svg{animation-delay:.13s}.stars i.on:nth-child(3) svg{animation-delay:.26s}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
.meta{font-size:13.5px;color:var(--sub);line-height:1.5}
.meta b{color:var(--navy)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:7px;height:11px;border-radius:2px;animation:cf 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes cf{to{transform:translateY(230px) rotate(540deg);opacity:0}}

/* story card */
.story{width:100%;max-width:380px;background:var(--sf);border-radius:24px;padding:26px 22px 22px;text-align:left;margin-top:12px}
.story h3{font-size:21px;font-weight:800;line-height:1.42;letter-spacing:-.035em;margin:14px 0 8px}
.pt{display:flex;gap:14px;padding:16px 0}
.pt+.pt{border-top:1px solid var(--line2)}
.pt .ix{flex:none;font-weight:800;font-size:13px;color:var(--navy);width:22px;margin-top:2px}
.pt .h{font-weight:700;font-size:15.5px;line-height:1.4;letter-spacing:-.025em}
.pt .d{font-size:14px;line-height:1.62;color:var(--sub);margin-top:4px}
.pt .d b{color:var(--ink);font-weight:600}
.gtip{margin-top:6px;background:var(--bg);border-radius:14px;padding:13px 15px;font-size:13.5px;line-height:1.6;color:var(--ch)}
.gtip .k{font-weight:700;color:var(--navy);margin-right:6px}
.gtip b{font-weight:700}
.story .fn{font-size:11.5px;color:var(--mute);line-height:1.6;margin-top:14px}
.story .sig{margin-top:18px;padding-top:16px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--sub)}
.result .btns{margin-top:24px}

/* final */
.mytier{width:100%;max-width:380px;border-radius:26px;padding:30px 20px 26px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;overflow:hidden;margin-top:14px}
.mytier .k{font-weight:700;font-size:11px;letter-spacing:.3em;opacity:.7;padding-left:.3em}
.mytier .c{font-weight:800;font-size:38px;letter-spacing:.12em;padding-left:.12em;line-height:1.1;margin-top:4px}
.mytier .n{font-size:18px;font-weight:700;letter-spacing:-.02em}
.mytier .t{font-weight:600;font-size:14px;opacity:.8;margin-top:8px;font-variant-numeric:tabular-nums}
.mt-WHITE{background:#fff;color:var(--ink) !important;box-shadow:inset 0 0 0 1px var(--line)}
.mt-SILVER{background:linear-gradient(135deg,#F3F4F6,#A7ACB5);color:#1A1C21 !important}
.mt-CHARCOAL{background:linear-gradient(135deg,#4A4B54,#2B2C32)}
.mt-NAVY{background:linear-gradient(135deg,#34477A,#141D35)}
.mt-BLACK{background:linear-gradient(135deg,#34353C,#000)}
.mytier::after{content:'';position:absolute;top:-60%;left:-60%;width:50%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:rotate(20deg);animation:sheen 3s ease-in-out infinite}
@keyframes sheen{0%{left:-60%}55%,100%{left:130%}}
.nextmsg{width:100%;max-width:380px;background:var(--tint);color:var(--navy);border-radius:16px;padding:15px 18px;font-size:14.5px;line-height:1.6;margin-top:12px;text-align:left}
.nextmsg b{font-weight:800}
.cta{width:100%;margin-top:24px;background:var(--sf);border-radius:24px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;text-align:left}
.cta .k{font-size:12.5px;font-weight:600;color:var(--sub)}
.cta .h{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.4}
.cta .btn{max-width:none}
.cta .s{font-size:12px;color:var(--mute);text-align:center}
.blk{width:100%;max-width:380px}
.tbl{width:100%;background:var(--sf);border-radius:var(--r);overflow:hidden}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--mute);font-weight:500;text-align:left;padding:14px 18px 10px}
.tbl td{padding:12px 18px;border-top:1px solid var(--line2);text-align:left;line-height:1.4}
.tbl td.r,.tbl th.r{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th.r{font-weight:500}
.tbl td.s{color:var(--navy);font-size:12px;letter-spacing:1px;text-align:right;white-space:nowrap;width:56px}
.tbl tr.tot td{font-weight:800;background:#FAFBFC}
.sharebox{width:100%;max-width:360px;font-size:12.5px;background:var(--sf);border-radius:14px;padding:12px;text-align:left;white-space:pre-wrap;user-select:text;-webkit-user-select:text;display:none;line-height:1.5}


/* final sections */
.fhero{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:0}
.fhero .btn{margin-top:14px;max-width:none}
.fsec{width:100%;max-width:380px;margin-top:36px;padding-top:32px;border-top:1px solid var(--line);text-align:left}
.fsec.last{border-top:0;padding-top:0;margin-top:16px;display:flex;justify-content:center}
.fsec .eh{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.fsec .tt{font-size:20px;font-weight:800;letter-spacing:-.035em;margin:4px 0 14px}
.fsec .fl{font-size:13.5px;color:var(--sub);line-height:1.55;margin:-6px 0 14px}
.fsec .cta{margin-top:0}
.btn.accent{background:linear-gradient(135deg,#6E8FD8 0%,#3C5A9E 100%);box-shadow:0 10px 22px rgba(60,90,158,.28)}
.btn.accent:active{background:linear-gradient(135deg,#6283CC,#344F8D)}

/* play area */
.play{position:absolute;inset:0;overflow:hidden;touch-action:none;perspective:900px;background:linear-gradient(180deg,#F0F2F5,#E4E7EC)}
.play.col{display:flex;flex-direction:column;align-items:center;padding:74px 16px 16px;gap:12px}
.play.col>*{flex-shrink:0}
.play.col>.cwrap{flex-shrink:1}
.hint{position:absolute;top:12px;left:16px;right:16px;z-index:40;background:rgba(255,255,255,.96);border-radius:16px;padding:12px 16px;font-size:15px;font-weight:500;text-align:center;pointer-events:none;min-height:50px;display:flex;align-items:center;justify-content:center;line-height:1.45;box-shadow:0 4px 14px rgba(17,19,24,.06)}
.hint b{color:var(--navy);font-weight:800}
.hint.pop{animation:hpop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes hpop{from{transform:scale(.96);opacity:.5}}
.toasts{position:absolute;left:0;right:0;bottom:92px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:70;pointer-events:none}
.toast{background:rgba(17,19,24,.9);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;animation:tin 1.8s forwards;max-width:90%;text-align:center;line-height:1.4}
.toast.bad{background:var(--bad)}.toast.good{background:var(--navy)}
@keyframes tin{0%{transform:translateY(8px);opacity:0}10%,80%{transform:none;opacity:1}100%{opacity:0}}
.cd{position:absolute;inset:0;z-index:80;background:rgba(14,17,24,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center}
.cd span{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:54px;color:var(--navy);letter-spacing:-.03em;box-shadow:0 12px 30px rgba(0,0,0,.18);animation:cdp .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes cdp{from{transform:scale(.4);opacity:0}}
.stamp{position:absolute;inset:0;z-index:85;display:grid;place-items:center;pointer-events:none;background:rgba(245,246,248,.55)}
.stamp span{font-weight:800;font-size:28px;letter-spacing:.2em;padding:18px 34px 18px calc(34px + .2em);color:#fff;background:var(--navy);border-radius:20px;animation:stp .45s cubic-bezier(.3,1.7,.5,1);box-shadow:0 14px 34px rgba(30,42,71,.3)}
.stamp span.f{background:var(--bad)}
@keyframes stp{from{transform:scale(.3);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{20%{translate:-7px 0}40%{translate:7px 0}60%{translate:-4px 0}80%{translate:3px 0}}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(51,68,107,.5)}50%{box-shadow:0 0 0 12px rgba(51,68,107,0)}}
.snap{transition:left .22s,top .22s !important}
.gone{opacity:0 !important;pointer-events:none !important;transition:opacity .35s}
.tapme{animation:tapme .9s infinite}
@keyframes tapme{50%{filter:drop-shadow(0 0 9px rgba(51,68,107,.85))}}

/* mat */
.mat{position:absolute;border-radius:12px;z-index:3;cursor:grab;display:grid;place-items:center;transition:left .3s,top .3s,width .3s,height .3s;
 background:repeating-linear-gradient(180deg,var(--m1) 0,var(--m2) 2px,var(--m3) 9px,var(--m2) 16px,var(--m1) 18px);
 border:5px solid var(--mb);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 5px 0 #26252B,0 14px 22px rgba(0,0,0,.16)}
.mat.v{background:repeating-linear-gradient(90deg,var(--m1) 0,var(--m2) 2px,var(--m3) 9px,var(--m2) 16px,var(--m1) 18px)}
.mat.nt{transition:none}
.mat.under{background:#D9DADD;border-color:#C6C8CC;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 5px 0 #A9ABB0,0 14px 22px rgba(0,0,0,.14)}
.mat.stack{box-shadow:0 5px 0 #26252B,0 9px 0 #8E9096,0 13px 0 #26252B,0 20px 22px rgba(0,0,0,.18)}
.mat .tagx{position:absolute;left:-5px;top:30%;width:5px;height:14px;background:#3E8C8C;border-radius:1px}
.mat .ar{font-weight:800;font-size:40px;color:#fff;pointer-events:none;text-align:center;line-height:1.05;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.mat .ar small{display:block;font-size:13px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.mat.under .ar{color:var(--navy);text-shadow:none}
.flap{position:absolute;z-index:4;border-radius:10px;pointer-events:none;border:4px solid var(--mb);background:repeating-linear-gradient(180deg,var(--m1) 0,var(--m2) 2px,var(--m3) 9px,var(--m2) 16px,var(--m1) 18px)}
.flap.under{background:#D9DADD;border-color:#C6C8CC}
.port{position:absolute;background:#F4F4F2;border-radius:5px;z-index:4;border:1px solid #CFCFCC;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.port::after{content:'';position:absolute;left:30%;right:30%;top:30%;bottom:30%;background:#9A9C9F;border-radius:2px}
.port.glow{box-shadow:0 0 0 3px #9DB3D9}
.conn{position:absolute;background:repeating-linear-gradient(90deg,#F6F5F2 0 4px,#DCDAD5 4px 6px);border:1px solid #C9C7C2;border-radius:6px;z-index:7;cursor:grab}
.plug{position:absolute;z-index:7;cursor:grab;transition:transform .35s}
.plug .pb{position:absolute;left:2px;right:2px;bottom:0;height:30px;border-radius:9px 9px 13px 13px;background:linear-gradient(90deg,#E7E6E2,#F7F6F3 40%,#DAD8D3);border:1px solid #C6C4BF}
.plug .pins{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;gap:11px}
.plug .pins i{width:6px;height:15px;border-radius:3px;background:linear-gradient(90deg,#A6A9AE,#D7DADE)}
.plug.rot{transform:rotate(180deg)}
.outlet{position:absolute;background:#fff;border-radius:18px;box-shadow:0 4px 0 #D3D6DB,0 10px 18px rgba(0,0,0,.06);z-index:2;display:grid;place-items:center}
.outlet .face{width:48px;height:48px;border-radius:50%;background:#EEF0F2;border:1px solid #DDE0E4;display:flex;gap:12px;align-items:center;justify-content:center}
.outlet .face i{width:8px;height:8px;border-radius:50%;background:#4B4E55}
.cables{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;transition:opacity .35s}
.cables path{fill:none;stroke-linecap:round}
.cables path.u{stroke:#B9BBBF;stroke-width:9}
.cables path.t{stroke:#F8F8F6;stroke-width:6}
.bag{position:absolute;background:linear-gradient(180deg,#3A4256,#262C3B);border-radius:16px 16px 22px 22px;box-shadow:0 7px 0 #191D28,0 16px 24px rgba(0,0,0,.16);transition:top .5s,opacity .5s;z-index:2}
.bag-zip{position:absolute;left:14px;right:14px;top:16px;height:9px;border-radius:5px;background:repeating-linear-gradient(90deg,#AEB4C2 0 3px,#6A7184 3px 6px);overflow:hidden}
.bag-zip i{display:block;height:100%;width:0;background:#0C0F16}

<body>

<div id="app">
  <div class="brandbar"><button class="ib l hide" id="hudX" aria-label="나가기"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><div class="logo-mark lgm" id="brandLogo" role="img" aria-label="DWALL"></div><button class="ib r mute" id="hudM" aria-label="소리"></button></div>

<script>
const SHARE_URL='https://ihvvea.github.io/thematgame/';
const PRODUCT_URL='https://mkt.shopping.naver.com/link/6ab07ca9e9427b0d1c00c907?nt_source=in&nt_medium=game';
const $=(s,r=document)=>r.querySelector(s);
const screen=$('#screen'),hud=$('#hud');
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mk(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e}
function box(parent,cls,x,y,w,h){const e=mk('div',cls,parent);e.style.left=x+'px';e.style.top=y+'px';if(w!=null)e.style.width=w+'px';if(h!=null)e.style.height=h+'px';return e}
function ctr(n){return{x:n.offsetLeft+n.offsetWidth/2,y:n.offsetTop+n.offsetHeight/2}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function moveTo(n,x,y){n.classList.add('snap');n.style.left=x+'px';n.style.top=y+'px';setTimeout(()=>n.classList.remove('snap'),260)}
function bump(n){n.classList.remove('shake');void n.offsetWidth;n.classList.add('shake')}
const STAR='<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
const SPK_ON='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>',SPK_OFF='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
const SHARE_IC='<svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v12M7 8l5-5 5 5"/></svg>';
const FLAKE='<svg viewBox="0 0 24 24"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/><path d="M9.5 3.8L12 6l2.5-2.2M9.5 20.2L12 18l2.5 2.2M3.6 10.2l3.2-1.1-.6-3.3M20.4 13.8l-3.2 1.1.6 3.3M3.6 13.8l3.2 1.1-.6 3.3M20.4 10.2l-3.2-1.1.6-3.3"/></svg>';

/* sound */
let AC=null,MUTE=false;

function tone(f,d=.08,type='sine',v=.06,when=0){if(MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
const sfx={tap:()=>tone(880,.05,'sine',.05),good:()=>{tone(784,.08);tone(1175,.14,'sine',.06,.08)},bad:()=>tone(180,.2,'triangle',.08),win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.18,'sine',.07,i*.1)),lose:()=>[392,330,262].forEach((f,i)=>tone(f,.22,'triangle',.07,i*.15)),cd:()=>tone(520,.1),go:()=>tone(1046,.25)};

/* tiers (총 기록) — 별 3개 기준 합계 101초 */
const TIERS=[
 {k:'BLACK',name:'더매트 레전드',max:68,desc:'상위 0.1%의 손놀림'},
 {k:'NAVY',name:'그랜드 마스터',max:84,desc:'조절기와 한 몸'},
 {k:'CHARCOAL',name:'매트 장인',max:101,desc:'전 단계 별 3개 수준'},
 {k:'SILVER',name:'따끈 숙련자',max:130,desc:'이제 좀 익숙해요'},

/* drag */
let CUR=null;
function dragify(n,o={}){
  n.style.touchAction='none';
  n.addEventListener('pointerdown',e=>{
    if(n.dataset.lock||!CUR||CUR.ended||!CUR.started)return;
    if(o.can&&o.can()===false)return;
    e.preventDefault();e.stopPropagation();
    try{n.setPointerCapture(e.pointerId)}catch(_){}
    const sx=e.clientX,sy=e.clientY,ox=parseFloat(n.style.left),oy=parseFloat(n.style.top);
    n.classList.remove('snap');o.start&&o.start();
    const mv=ev=>{let nx=ox+(o.axis==='y'?0:ev.clientX-sx),ny=oy+(o.axis==='x'?0:ev.clientY-sy);
      if(o.axis==='x')nx=clamp(nx,o.min,o.max);if(o.axis==='y')ny=clamp(ny,o.min,o.max);
      n.style.left=nx+'px';n.style.top=ny+'px';o.move&&o.move(nx,ny)};
    const up=()=>{n.removeEventListener('pointermove',mv);n.removeEventListener('pointerup',up);n.removeEventListener('pointercancel',up);
      if(CUR&&!CUR.ended)o.end&&o.end(parseFloat(n.style.left),parseFloat(n.style.top),ox,oy)};
    n.addEventListener('pointermove',mv);n.addEventListener('pointerup',up);n.addEventListener('pointercancel',up);
  });
}
function cableLayer(area){
  const NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg');svg.setAttribute('class','cables');area.appendChild(svg);
  const lines=[];
  return{svg,add(fa,fb){const u=document.createElementNS(NS,'path'),t=document.createElementNS(NS,'path');u.setAttribute('class','u');t.setAttribute('class','t');svg.appendChild(u);svg.appendChild(t);lines.push({u,t,fa,fb})},
    draw(){lines.forEach(l=>{const a=l.fa(),b=l.fb();const my=Math.max(a.y,b.y)+34;const d=`M${a.x} ${a.y} C${a.x} ${my} ${b.x} ${my} ${b.x} ${b.y}`;l.u.setAttribute('d',d);l.t.setAttribute('d',d)})}};
}

/* chrome */
let NAV=null;
function chrome(mode,back){$('#hudX').classList.toggle('hide',mode==='none');hud.classList.toggle('show',mode==='play');NAV=back||null}
function exitPlay(){if(CUR&&!CUR.ended){CUR.ended=true;CUR.timers.forEach(clearTimeout);CUR.cleanups.forEach(f=>f())}}
$('#hudX').onclick=()=>{exitPlay();(NAV||showMap)()};

/* runner */
function startStage(i){
  const S=STAGES[i];
  screen.innerHTML='';
  chrome('play',showMap);$('#hudS').textContent=`STAGE ${S.n} / ${STAGES.length}`;$('#hudN').textContent=S.name;$('#hudG').textContent=`★3 ${S.goal}초 · 제한 ${S.limit}초`;$('#hudT').textContent='0.0';
  const area=mk('div','play',screen);
  const hint=mk('div','hint',area);
  const toasts=mk('div','toasts',area);
  exitPlay();
  const r={i,S,area,ended:false,started:false,paused:true,t0:0,pausedAt:0,pen:0,timers:[],ticks:[],cleanups:[]};
  CUR=r;
  const elapsed=()=>r.started?((r.paused?r.pausedAt:performance.now())-r.t0)/1000+r.pen:0;
  const api={area,W:area.clientWidth,H:area.clientHeight,
    hint:h=>{hint.innerHTML='<span>'+h+'</span>';hint.classList.remove('pop');void hint.offsetWidth;hint.classList.add('pop')},
    toast:(t,k='')=>{const e=mk('div','toast '+k,toasts,t);setTimeout(()=>e.remove(),1800)},
    penalty:(s,msg)=>{if(r.ended||!r.started)return;r.pen+=s;sfx.bad();api.toast(msg+' · +'+s+'초','bad');const t=$('#hudT');t.classList.remove('pen');void t.offsetWidth;t.classList.add('pen')},
    pause:()=>{if(!r.paused){r.paused=true;r.pausedAt=performance.now()}},
    resume:()=>{if(r.paused&&r.started){r.t0+=performance.now()-r.pausedAt;r.paused=false}},
    after:(ms,fn)=>{const id=setTimeout(()=>{if(!r.ended)fn()},ms);r.timers.push(id);return id},
    tick:fn=>r.ticks.push(fn),cleanup:fn=>r.cleanups.push(fn),
    done:()=>finish(true),live:()=>!r.ended&&r.started};
  S.play(api);
  (function loop(){if(r.ended)return;r.ticks.forEach(f=>f());if(r.started){const e=elapsed();$('#hudT').textContent=e.toFixed(1);if(e>S.limit){finish(false);return}}requestAnimationFrame(loop)})();
  const cd=mk('div','cd',area);let c=3;
  const step=()=>{if(r.ended)return;if(c>0){cd.innerHTML='<span>'+c+'</span>';sfx.cd();c--;setTimeout(step,650)}else{cd.innerHTML='<span style="font-size:36px">GO</span>';sfx.go();setTimeout(()=>{cd.remove();if(r.ended)return;r.started=true;r.paused=false;r.t0=performance.now()},420)}};
  step();
  function finish(ok){
    if(r.ended)return;const t=elapsed();r.ended=true;r.timers.forEach(clearTimeout);r.cleanups.forEach(f=>f());
    $('#hudT').textContent=t.toFixed(1);
    mk('div','stamp',area,ok?'<span>CLEAR</span>':'<span class="f">TIME OVER</span>');
    ok?sfx.win():sfx.lose();
    setTimeout(()=>{if(CUR===r)showResult(i,ok,t,r.pen)},1000);
  }
}

const ZIP_R='<svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>',ZIP_L='<svg viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18"/></svg>';
function stage1(api){
  const A=api.area,W=api.W,H=api.H,T=60,h=H-T-10;
  api.hint('지퍼 손잡이를 <b>오른쪽으로 쭉</b> 밀어 가방을 열어요');
  const bx=W*.12,by=T+h*.4,bw=W*.76,bh=h*.34;
  const bag=box(A,'bag',bx,by,bw,bh);bag.innerHTML='<div class="bag-handle"></div><div class="bag-zip"><i></i></div><div class="bag-logo"><span class="lgm"></span><small>THE MAT</small></div>';
  const zi=bag.querySelector('.bag-zip i');
  const zx0=bx+4,zx1=bx+bw-44;
  const pull=box(A,'zip-pull pulse',zx0,by,40,40);pull.innerHTML=ZIP_R;
  dragify(pull,{axis:'x',min:zx0,max:zx1,move:x=>{zi.style.width=((x-zx0)/(zx1-zx0)*100)+'%'},
    end:x=>{if(x>=zx0+(zx1-zx0)*.82){pull.dataset.lock=1;pull.classList.remove('pulse');pull.style.left=zx1+'px';zi.style.width='100%';sfx.good();phaseB()}else{moveTo(pull,zx0,by);zi.style.width='0'}}});
  let mat;
  function phaseB(){
    api.hint('매트를 <b>위로 끌어올려</b> 꺼내요');
    bag.querySelector('.bag-handle').style.opacity=0;
    const ry=by-h*.09;
    mat=matEl(A,bx+bw*.14,ry,bw*.72,h*.13,'nt stack');mat.innerHTML='<div class="ar">↑</div>';
    dragify(mat,{axis:'y',min:T,max:ry,end:y=>{if(ry-y>h*.1){mat.dataset.lock=1;sfx.good();phaseC()}else moveTo(mat,bx+bw*.14,ry)}});
  }
  function phaseC(){
    pull.classList.add('gone');bag.style.top=(H+20)+'px';bag.style.opacity=0;
    mat.classList.remove('nt');
    api.hint('매트를 <b>두 번 탭</b>해서 펼쳐요');
    const steps=[[W*.34,T+h*.15,W*.32,h*.3],[W*.21,T+h*.08,W*.58,h*.38],[W*.08,T+h*.02,W*.84,h*.44]];
    let k=0;const set=s=>{mat.style.left=s[0]+'px';mat.style.top=s[1]+'px';mat.style.width=s[2]+'px';mat.style.height=s[3]+'px'};
    set(steps[0]);mat.innerHTML='<div class="ar">TAP<small>탭해서 펼치기</small></div>';
    const tap=e=>{if(!api.live())return;e.preventDefault();k++;sfx.tap();set(steps[k]);if(k===1)mat.classList.remove('stack');
      if(k>=2){mat.removeEventListener('pointerdown',tap);mat.innerHTML='';mk('i','tagx',mat);mat.style.cursor='default';api.after(330,phaseD)}};
    mat.addEventListener('pointerdown',tap);
  }
  function phaseD(){
    const mx=W*.08,my=T+h*.02,mw=W*.84,mh=h*.44;
    const port=box(A,'port pulse',mx+mw*.78,my-8,30,20);
    const ctl=miniRC(A,W*.07,T+h*.54);
    const conn=box(A,'conn',W*.42,T+h*.58,40,26);
    const plug=box(A,'plug',W*.36,T+h*.84,40,46);plug.innerHTML='<div class="pins"><i></i><i></i></div><div class="pb"></div>';
    const out=box(A,'outlet',W*.68,T+h*.62,80,80);out.innerHTML='<div class="face"><i></i><i></i></div>';
    const cab=cableLayer(A);
    const base=()=>({x:ctl.offsetLeft+31,y:ctl.offsetTop+150});
    cab.add(base,()=>({x:conn.offsetLeft+20,y:conn.offsetTop+24}));
    cab.add(base,()=>({x:plug.offsetLeft+20,y:plug.offsetTop+44}));
    api.tick(cab.draw);
    api.hint('<b>접속기</b>를 매트 위쪽 <b>접속구</b>에 꽂아요');
    let connected=false;
    const c0={x:conn.offsetLeft,y:conn.offsetTop},p0={x:plug.offsetLeft,y:plug.offsetTop};
    dragify(conn,{end:()=>{if(dist(ctr(conn),ctr(port))<50){connected=true;conn.dataset.lock=1;moveTo(conn,port.offsetLeft-5,port.offsetTop-24);port.classList.remove('pulse');port.classList.add('glow');sfx.good();
        api.hint('전원 <b>플러그</b>를 <b>콘센트</b>에 꽂아요');out.classList.add('pulse')}else moveTo(conn,c0.x,c0.y)}});
    dragify(plug,{end:()=>{
      if(!connected&&dist(ctr(plug),ctr(out))<60){api.penalty(1,'접속기부터 매트에 꽂아야 해요');moveTo(plug,p0.x,p0.y);bump(port);return}
      if(connected&&dist(ctr(plug),ctr(out))<60){plug.dataset.lock=1;out.classList.remove('pulse');moveTo(plug,out.offsetLeft+20,out.offsetTop+17);sfx.good();emf()}else moveTo(plug,p0.x,p0.y)}});
    const dL=ctl.querySelector('.rc-dg[data-s=L]');
    function emf(){
      api.pause();miniShow(ctl,'8','8',true);
      api.hint('조절기 화면을 확인하는 중…');
      api.after(650,()=>{
        if(Math.random()<.55){
          miniShow(ctl,'0','',true);dL.classList.add('blink');api.resume();
          api.hint('<b>"0"이 3번 깜빡!</b> 플러그를 <b>탭</b>해서 돌려 꽂아요');plug.classList.add('tapme');
          const rot=e=>{if(!api.live())return;e.preventDefault();plug.removeEventListener('pointerdown',rot);plug.classList.remove('tapme');plug.classList.add('rot');sfx.tap();api.pause();
            dL.classList.remove('blink');miniShow(ctl,'8','8',true);
            api.after(450,()=>{miniShow(ctl,'','',false);api.hint('화면이 한 번 켜졌다 꺼지면 <b>EMF 차단 정상</b>');sfx.good();api.after(600,api.done)})};
          plug.addEventListener('pointerdown',rot);
        }else{miniShow(ctl,'','',false);api.hint('화면이 한 번 켜졌다 꺼지면 <b>EMF 차단 정상</b>');sfx.good();api.after(650,api.done)}
      });
    }
  }
}

/* interactive controller + side panels */
const MODES=['normal','hh','ll','turbo'],MNAME={normal:'일반',hh:'고온선호',ll:'저온선호',turbo:'터보'},TIMERS=[0,3,6,9,12,15];
function panelHTML(s){return`<div class="sd">${s==='L'?'왼쪽':'오른쪽'}<i></i></div><div class="mv"></div><div class="lv"></div><div class="bar"><i></i></div><div class="ex"></div>`}
function makeRC(wrap,api,{modes=true,timer=true}={}){
  const st={power:false,locked:false,timer:0,L:{level:1,mode:'normal'},R:{level:1,mode:'normal'}};
  const pL=mk('div','spanel',wrap,panelHTML('L'));
  const holder=mk('div','rcbox',wrap);holder.innerHTML=rcMarkup();
  const pR=mk('div','spanel',wrap,panelHTML('R'));
  const el=holder.querySelector('.rc');el.classList.add('big');
  if(!modes)el.querySelectorAll('[data-a=md]').forEach(b=>b.classList.add('dim'));
  if(!timer)el.querySelector('[data-a=tm]').classList.add('dim');
  const C={st,el,render,onLock:null,onPower:null,onChange:null,panel:{L:pL,R:pR}};
  function render(){el.classList.toggle('on',st.power);
    ['L','R'].forEach(s=>{const d=el.querySelector('.rc-dg[data-s='+s+']'),v=st[s],p=C.panel[s];d.innerHTML=v.mode==='turbo'?'<span class="spin"></span>':v.level;
      el.querySelectorAll('.rc-ind[data-side='+s+'] [data-i]').forEach(x=>x.classList.toggle('lit',st.power&&x.dataset.i===v.mode));
      p.classList.toggle('on',st.power);p.classList.toggle('off',!st.power);
      p.querySelector('.mv').textContent=st.power?MNAME[v.mode]+' 모드':'꺼짐';
      p.querySelector('.lv').innerHTML=!st.power?'–':v.mode==='turbo'?'MAX':v.level+'<small>단</small>';
      p.querySelector('.bar i').style.width=!st.power?'0':v.mode==='turbo'?'100%':(v.level/9*100)+'%';
      p.querySelector('.ex').innerHTML=st.locked?'<span>잠금</span><b>ON</b>':`<span>타이머</span><b>${st.power&&st.timer?st.timer+'h':'–'}</b>`});
    el.querySelector('.rc-ic [data-i=lock]').classList.toggle('lit',st.locked);
    el.querySelector('.rc-ic [data-i=timer]').classList.toggle('lit',st.power&&st.timer>0);
    C.onChange&&C.onChange(st)}
  const lockMsg=()=>{api.toast('잠금 중이에요. 전원 버튼을 길게 눌러 해제하세요');sfx.bad();bump(el)};
  const guard=()=>{if(!api.live())return false;if(st.locked){lockMsg();return false}if(!st.power){api.toast('전원부터 켜 주세요');sfx.bad();bump(el.querySelector('.pw'));return false}return true};
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(!guard())return;const a=b.dataset.a,s=st[b.dataset.s];
    if(a==='tm'){st.timer=TIMERS[(TIMERS.indexOf(st.timer)+1)%TIMERS.length]}
    else if(a==='md'){s.mode=MODES[(MODES.indexOf(s.mode)+1)%4]}
    else{if(s.mode==='turbo'){api.toast('터보 모드는 단수 조절이 안 돼요');sfx.bad();return}s.level=clamp(s.level+(a==='up'?1:-1),1,9)}
    sfx.tap();render()});
  const pw=el.querySelector('.pw'),ring=pw.querySelector('.ring');let pressed=false,held=false,ht=null,t0=0,raf=0;
  const ringLoop=()=>{if(!pressed)return;ring.style.width=Math.min(100,(performance.now()-t0)/15)+'%';raf=requestAnimationFrame(ringLoop)};
  pw.addEventListener('pointerdown',e=>{if(!api.live())return;e.preventDefault();pressed=true;held=false;t0=performance.now();ringLoop();
    ht=setTimeout(()=>{if(!pressed||!api.live())return;held=true;st.locked=!st.locked;sfx.good();api.toast(st.locked?'차일드락 ON':'잠금 해제','good');render();C.onLock&&C.onLock(st.locked)},1500)});
  const rel=()=>{if(!pressed)return;pressed=false;clearTimeout(ht);cancelAnimationFrame(raf);ring.style.width='0';
    if(!held&&api.live()){if(st.locked){lockMsg();return}st.power=!st.power;sfx.tap();render();C.onPower&&C.onPower(st.power)}};
  pw.addEventListener('pointerup',rel);pw.addEventListener('pointerleave',rel);pw.addEventListener('pointercancel',rel);
  api.cleanup(()=>clearTimeout(ht));
  const fit=()=>{el.style.transform='';const cap=innerWidth>=900?1.3:1;const avW=wrap.clientWidth-pL.offsetWidth-pR.offsetWidth-18;const s=Math.max(.55,Math.min(cap,(wrap.clientHeight-2)/el.offsetHeight,avW/el.offsetWidth));
    el.style.transformOrigin='0 0';el.style.transform='scale('+s+')';holder.style.width=el.offsetWidth*s+'px';holder.style.height=el.offsetHeight*s+'px'};
  render();fit();setTimeout(fit,60);setTimeout(fit,400);
  try{const ro=new ResizeObserver(()=>fit());ro.observe(wrap);api.cleanup(()=>ro.disconnect())}catch(e){}
  C.focus=s=>{['L','R'].forEach(k=>C.panel[k].classList.toggle('act',k===s||s==='both'))};
  return C;
}

   <div class="bed">${['L','R'].map(s=>`<div class="half" data-s="${s}"><div class="heat"></div><div class="pil"></div><div class="face"></div><span class="side">${s==='L'?'왼쪽':'오른쪽'}</span></div>`).join('')}</div>`);
  return{
    set(s,{ava,who,text}){const b=w.querySelector('.bub2[data-s='+s+']'),hf=w.querySelector('.half[data-s='+s+']');b.classList.remove('empty','happy','in');void b.offsetWidth;b.classList.add('in');b.innerHTML=`<div class="who">${who}</div><div>${text}</div>`;
      hf.classList.add('occ');const f=hf.querySelector('.face');f.textContent=ava;f.classList.remove('in');void f.offsetWidth;f.classList.add('in')},
    clear(s){w.querySelector('.bub2[data-s='+s+']').classList.add('empty');w.querySelector('.half[data-s='+s+']').classList.remove('occ')},
    happy(s,t){const b=w.querySelector('.bub2[data-s='+s+']');b.classList.add('happy');b.innerHTML=`<div>${t}</div>`},
    bub(s){return w.querySelector('.bub2[data-s='+s+']')},
    heat(st){['L','R'].forEach(s=>{const ht=w.querySelector('.half[data-s='+s+'] .heat'),v=st[s];
      ht.style.opacity=st.power?(v.mode==='turbo'?1:.15+v.level/9*.8):0;ht.classList.toggle('turbo',st.power&&v.mode==='turbo')})}
  };
}

/* requests */
const AVAS=['🧑','👵','🧔','👩','👴','👧','👨','👩‍🦳','🧓','👱‍♀️'];
const L2=[n=>`으슬으슬… <b>${n}단</b> 부탁해요`,n=>`<b>${n}단</b>이 딱 좋아요`,n=>`밖이 영하래요, <b>${n}단</b>`,n=>`발이 꽁꽁… <b>${n}단</b>이요`,n=>`오늘은 <b>${n}단</b> 기분`,n=>`<b>${n}단</b>, 빨리요~`];
const PH={normal:[n=>`기본 모드로 <b>${n}단</b>이요`,n=>`평소처럼 일반 <b>${n}단</b>`],
  hh:[n=>`추위를 엄청 타요<br><b>${n}단</b>!`,n=>`몸이 찬 편이라<br><b>${n}단</b>`],
  ll:[n=>`열이 많은 체질<br><b>${n}단</b>만`,n=>`더위를 잘 타요<br><b>${n}단</b>`],
  turbo:[()=>`허리가 뻐근해요<br><b>찜질</b> 부탁해요`,()=>`어깨 좀<br><b>뜨끈하게 지져</b>주세요`]};
function nextLevel(prev,lo=1,hi=9){let n,g=0;do{n=rand(lo,hi);g++}while(Math.abs(n-prev)<2&&g<30);return n}
function checkReq(r,s,timerVal){
  if(r.mode&&s.mode!==r.mode)return r.mode==='turbo'?'찜질은 터보 모드예요':'모드가 달라요 ('+MNAME[r.mode]+')';
  if(r.mode!=='turbo'&&s.level!==r.level)return r.level+'단이라니까요';
  if(r.timer&&timerVal!==r.timer)return'타이머 '+r.timer+'시간이요';
  return null}
function makeModeReq(kind,prevLevel,withTimer){
  const n=kind==='turbo'?0:kind==='hh'?nextLevel(prevLevel,5,9):kind==='ll'?nextLevel(prevLevel,1,5):nextLevel(prevLevel);const t=withTimer?pick([3,6,9,12]):0;
  let text=pick(PH[kind])(n);if(t)text+=` · 타이머 <b>${t}시간</b>`;
  return{mode:kind,level:n,timer:t,text}}
const HAPPY=['따뜻해요','딱 좋아요','최고예요','꿀잠 예약'];

/* STAGE 2 & 3 */
function custStage(api,{reqs,legend,modes,timer}){
  const A=api.area;A.classList.add('col');
  const bed=makeBed(A);
  if(legend)mk('div','legend',A,'추위 탐 → <b>고온선호</b> · 더위 탐 → <b>저온선호</b> · 찜질 → <b>터보</b>');
  const wrap=mk('div','cwrap',A);const C=makeRC(wrap,api,{modes,timer});
  C.onChange=st=>bed.heat(st);bed.heat(C.st);
  const sv=mk('button','btn serve',A,'이대로 드리기');
  let idx=0,busy=false;const avs=shuffle(AVAS);
  function show(){const r=reqs[idx],o=r.side==='L'?'R':'L';bed.clear(o);bed.set(r.side,{ava:avs[idx%avs.length],who:`손님 ${idx+1}/${reqs.length}`,text:r.text});C.focus(r.side)}
  api.hint('먼저 조절기 <b>전원</b> 버튼부터 눌러요');
  C.onPower=on=>{if(on)api.hint(modes?'손님 쪽 <b>M</b>으로 모드, <b>▲▼</b>로 단계 맞추기':'손님이 누운 쪽 <b>▲▼</b>로 단계 맞추기')};
  show();
  sv.onclick=()=>{if(!api.live()||busy)return;
    if(C.st.locked){api.toast('잠금부터 풀어 주세요');sfx.bad();return}
    if(!C.st.power){api.penalty(1,'전원이 꺼져 있어요');return}
    const r=reqs[idx],miss=checkReq(r,C.st[r.side],C.st.timer);
    if(miss){api.penalty(2,miss);bump(bed.bub(r.side));return}
    busy=true;sfx.good();bed.happy(r.side,pick(HAPPY));
    api.after(420,()=>{busy=false;idx++;if(idx>=reqs.length)api.done();else show()})};
}
function stage2(api){
  const reqs=[];const pv={L:1,R:1};for(let k=0;k<6;k++){const side=pick(['L','R']);const n=nextLevel(pv[side]);pv[side]=n;reqs.push({side,level:n,mode:null,text:pick(L2)(n)})}
  custStage(api,{reqs,legend:false,modes:false,timer:false});
}
function stage3(api){
  const kinds=shuffle(['hh','ll','turbo','hh','ll']);if(kinds[0]==='turbo')kinds.push(kinds.shift());
  const pv={L:1,R:1};const reqs=kinds.map(k=>{const side=pick(['L','R']);const r=makeModeReq(k,pv[side],false);if(r.level)pv[side]=r.level;r.side=side;return r});
  custStage(api,{reqs,legend:true,modes:true,timer:false});
}

/* STAGE 4 */
function stage4(api){
  const A=api.area;A.classList.add('col');
  const pairs=shuffle([['아빠','👨','엄마','👩'],['할아버지','👴','할머니','👵'],['나','🧑','냥이','🐱'],['엄마','👩','딸','👧'],['형','🧔','동생','👦']]).slice(0,4);
  const bed=makeBed(A);
  const wrap=mk('div','cwrap',A);const C=makeRC(wrap,api);
  C.onChange=st=>bed.heat(st);bed.heat(C.st);C.focus('both');
  const sv=mk('button','btn serve',A,'둘 다 맞으면 드리기');
  let idx=0,busy=false,pL=1,pR=1,cur=null,babyOn=false;
  const kindPool=['normal','hh','ll','hh','ll','turbo'];
  const babyRounds=[1,3];
  function mkSide(name,prev){
    if(name==='냥이'){const n=nextLevel(prev,1,4);return{mode:'ll',level:n,timer:0,text:`냐옹~ 더위 타는 냥이<br><b>${n}단</b>`}}
    return makeModeReq(pick(kindPool),prev,false)}
  const rh=()=>`라운드 <b>${idx+1}/${pairs.length}</b> · 좌우 <b>각각</b> 맞추고 드리기`;
  function round(){
    const p=pairs[idx];const L=mkSide(p[0],pL),R=mkSide(p[2],pR);if(L.level)pL=L.level;if(R.level)pR=R.level;cur={L,R};
    bed.set('L',{ava:p[1],who:p[0],text:L.text});bed.set('R',{ava:p[3],who:p[2],text:R.text});
    if(babyRounds.includes(idx))api.after(rand(1300,2600),baby);
  }
  api.hint('먼저 조절기 <b>전원</b> 버튼부터 눌러요');
  C.onPower=on=>{if(on&&!babyOn)api.hint(rh())};
  function baby(){
    babyOn=true;sfx.bad();
    api.hint('아기 출현! <b>전원 버튼 1.5초 꾹</b> → 차일드락');
    const b=mk('div','baby',A,'👶');const bar=mk('div','babybar',A,'<i></i>');
    requestAnimationFrame(()=>{b.style.left=(A.clientWidth/2-28)+'px';bar.firstChild.style.width='0'});
    const end=locked=>{if(!babyOn)return;babyOn=false;C.onLock=null;bar.remove();
      if(locked){b.style.transition='left .6s';b.textContent='😤';b.style.left='-80px';api.after(700,()=>b.remove());
        api.hint('아기 퇴장! <b>다시 길게</b> 눌러 잠금 해제하고 계속')}
      else{b.textContent='😆';['L','R'].forEach(s=>{C.st[s].level=rand(1,9);C.st[s].mode=pick(['normal','hh','ll'])});C.st.timer=pick(TIMERS);C.render();bump(C.el);
        api.penalty(3,'아기가 버튼을 다 눌러버렸어요');api.hint('다시 맞춰 주세요');api.after(900,()=>b.remove())}};
    if(C.st.locked){api.after(400,()=>end(true));return}
    C.onLock=l=>{if(l)end(true)};
    api.after(4000,()=>end(C.st.locked));
  }
  round();
  sv.onclick=()=>{if(!api.live()||busy)return;
    if(C.st.locked){api.toast('잠금부터 풀어 주세요 (전원 길게)');sfx.bad();return}
    if(!C.st.power){api.penalty(1,'전원이 꺼져 있어요');return}
    const mL=checkReq(cur.L,C.st.L,C.st.timer),mR=checkReq(cur.R,C.st.R,C.st.timer);
    if(mL||mR){api.penalty(2,(mL?'왼쪽: '+mL:'오른쪽: '+mR));bump(bed.bub(mL?'L':'R'));return}
    busy=true;sfx.good();bed.happy('L',pick(HAPPY));bed.happy('R',pick(HAPPY));
    api.after(500,()=>{busy=false;idx++;if(idx>=pairs.length){api.done();return}round();if(!babyOn)api.hint(rh())})};
}

/* STAGE 5 */
function stage5(api){
  const A=api.area,W=api.W,H=api.H,T=60,h=H-T-10;
  const mx=W*.08,my=T+h*.02,mw=W*.84,mh=h*.44;
  const mat=matEl(A,mx,my,mw,mh);mat.style.cursor='default';mk('i','tagx',mat);
  const port=box(A,'port glow',mx+mw*.78,my-8,30,20);
  const ctl=miniRC(A,W*.07,T+h*.54);miniShow(ctl,'5','5',true);
  const conn=box(A,'conn',port.offsetLeft-5,port.offsetTop-24,40,26);
  const out=box(A,'outlet',W*.68,T+h*.62,80,80);out.innerHTML='<div class="face"><i></i><i></i></div>';
  const plug=box(A,'plug',out.offsetLeft+20,out.offsetTop+17,40,46);plug.innerHTML='<div class="pins"><i></i><i></i></div><div class="pb"></div>';
  const cab=cableLayer(A);
  const base=()=>({x:ctl.offsetLeft+31,y:ctl.offsetTop+150});
  cab.add(base,()=>({x:conn.offsetLeft+20,y:conn.offsetTop+24}));
  cab.add(base,()=>({x:plug.offsetLeft+20,y:plug.offsetTop+44}));
  api.tick(cab.draw);
  let step=0;
  api.hint('조절기를 <b>탭</b>해서 전원을 꺼요');ctl.classList.add('tapme');
  ctl.addEventListener('pointerdown',e=>{if(!api.live()||step!==0)return;e.preventDefault();step=1;miniShow(ctl,'','',false);ctl.classList.remove('tapme');sfx.good();
    api.hint('<b>플러그</b>를 콘센트에서 끌어내 뽑아요');plug.classList.add('tapme')});
  const why=()=>step===0?'전원부터 꺼야 해요':'플러그부터 뽑아요';
  dragify(plug,{can:()=>{if(step===0){api.penalty(1,why());bump(ctl);return false}},
    end:()=>{if(dist(ctr(plug),ctr(out))>75){plug.dataset.lock=1;plug.classList.remove('tapme');step=2;sfx.good();api.hint('<b>접속기</b>를 매트에서 끌어내 분리해요');conn.classList.add('tapme')}
      else moveTo(plug,out.offsetLeft+20,out.offsetTop+17)}});
  dragify(conn,{can:()=>{if(step<2){api.penalty(1,why());return false}},
    end:()=>{if(dist(ctr(conn),ctr(port))>60){conn.dataset.lock=1;conn.classList.remove('tapme');step=3;sfx.good();foldPhase()}else moveTo(conn,port.offsetLeft-5,port.offsetTop-24)}});
  function foldPhase(){
    [ctl,conn,plug,out,port,cab.svg].forEach(n=>n.classList.add('gone'));
    let fx=W*.1,fy=T+h*.12,fw=W*.8,fh=h*.56;
    const setM=()=>{mat.style.left=fx+'px';mat.style.top=fy+'px';mat.style.width=fw+'px';mat.style.height=fh+'px'};
    setM();
    const seq=[];const ax=shuffle(['h','v']);for(let k=0;k<4;k++){const a=ax[k%2];seq.push(a==='h'?pick(['L','R']):pick(['U','D']))}
    const AR={L:['←','왼쪽으로'],R:['→','오른쪽으로'],U:['↑','위로'],D:['↓','아래로']};
    let k=0,anim=false;
    const showArrow=()=>{mat.innerHTML=`<div class="ar">${AR[seq[k]][0]}<small>${AR[seq[k]][1]} 접기 · ${k+1}/4</small></div>`};
    api.after(350,()=>{mat.classList.add('nt');showArrow();api.hint('화살표 방향으로 <b>스와이프</b>해서 접어요')});
    function fold(dir){
      if(anim||k>=4||!api.live())return;
      if(dir!==seq[k]){api.penalty(1,'반대 방향이에요');bump(mat);return}
      anim=true;sfx.tap();
      let f;const hw=fw/2,hh=fh/2,und=mat.classList.contains('under');
      if(dir==='L'){f=box(A,'flap',fx+hw,fy,hw,fh);f.style.transformOrigin='left center';fw=hw}
      if(dir==='R'){f=box(A,'flap',fx,fy,hw,fh);f.style.transformOrigin='right center';fx+=hw;fw=hw}
      if(dir==='U'){f=box(A,'flap',fx,fy+hh,fw,hh);f.style.transformOrigin='center top';fh=hh}
      if(dir==='D'){f=box(A,'flap',fx,fy,fw,hh);f.style.transformOrigin='center bottom';fy+=hh;fh=hh}
      if(und)f.classList.add('under');
      const tr={L:'rotateY(-180deg)',R:'rotateY(180deg)',U:'rotateX(180deg)',D:'rotateX(-180deg)'}[dir];
      mat.innerHTML='';
      f.animate([{transform:'none'},{transform:tr}],{duration:260,easing:'ease-in'});
      api.after(130,setM);
      api.after(260,()=>{f.remove();anim=false;k++;mat.classList.toggle('under');mat.classList.add('stack');if(k<4)showArrow();else toBag()});
    }
    let sx=0,sy=0,down=false;
    const pd=e=>{if(k>=4)return;down=true;sx=e.clientX;sy=e.clientY};
    const pu=e=>{if(!down)return;down=false;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;
      fold(Math.abs(dx)>Math.abs(dy)?(dx<0?'L':'R'):(dy<0?'U':'D'))};
    const kd=e=>{const m={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'}[e.key];if(m&&k<4){e.preventDefault();fold(m)}};
    A.addEventListener('pointerdown',pd);A.addEventListener('pointerup',pu);window.addEventListener('keydown',kd);
    api.cleanup(()=>window.removeEventListener('keydown',kd));
    function toBag(){
      A.removeEventListener('pointerdown',pd);A.removeEventListener('pointerup',pu);
      mat.classList.remove('nt');mat.style.cursor='grab';mat.innerHTML='';
      const bx=W*.14,by=T+h*.66,bw=W*.72,bh=h*.3;
      const bag=box(A,'bag',bx,H+20,bw,bh);bag.innerHTML='<div class="bag-handle"></div><div class="bag-zip"><i style="width:100%"></i></div><div class="bag-logo"><span class="lgm"></span><small>THE MAT</small></div>';
      requestAnimationFrame(()=>{bag.style.top=by+'px'});
      fx=W/2-fw/2;fy=T+h*.18;setM();
      api.hint('접은 매트를 <b>가방에 쏙</b> 넣어요');
      api.after(320,()=>mat.classList.add('nt'));
      dragify(mat,{end:()=>{const c=ctr(mat);if(c.x>bx&&c.x<bx+bw&&c.y>by-30&&c.y<by+bh){mat.dataset.lock=1;mat.classList.remove('nt');sfx.good();
          mat.style.left=(bx+bw/2-fw/2)+'px';mat.style.top=(by+10)+'px';mat.style.opacity=0;api.after(300,()=>{mat.remove();zipClose(bag,bx,by,bw)})}
        else moveTo(mat,fx,fy)}});
    }
    function zipClose(bag,bx,by,bw){
      api.hint('지퍼를 <b>왼쪽으로 쭉</b> 닫아요');
      const zi=bag.querySelector('.bag-zip i');const zx0=bx+4,zx1=bx+bw-44;
      const pull=box(A,'zip-pull pulse',zx1,by,40,40);pull.innerHTML=ZIP_L;
      dragify(pull,{axis:'x',min:zx0,max:zx1,move:x=>{zi.style.width=((x-zx0)/(zx1-zx0)*100)+'%'},
        end:x=>{if(x<=zx0+(zx1-zx0)*.18){pull.dataset.lock=1;pull.classList.remove('pulse');pull.style.left=zx0+'px';zi.style.width='0';api.hint('정리 끝! 다음 겨울에 또 만나요');api.done()}
          else{moveTo(pull,zx1,by);zi.style.width='100%'}}});
    }
  }
}

renderAside();showTitle();syncMute();
</script>
</body>
